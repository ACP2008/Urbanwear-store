<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f2ec">
<title>URABANWEAR — City uniform, redefined</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap');
:root
{
    --paper:#f4f2ec;
    --white:#fff;
    --ink:#171914;
    --muted:#777970;
    --line:#deded6;
    --lime:#d4f35c;
    --soft:#e9e8e1;
    --sans:'DM Sans',Arial,sans-serif;
    --display:'Oswald','Arial Narrow',sans-serif
}
*
{
    box-sizing:border-box
}
html
{
    scroll-behavior:smooth
}
body
{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font:14px var(--sans);
    -webkit-font-smoothing:antialiased
}
button,input,select
{
    font:inherit
}
button
{
    cursor:pointer
}
a
{
    color:inherit;
    text-decoration:none
}
.wrap
{
    width:min(1280px,calc(100% - 40px));
    margin:auto
}
.announce
{
    height:30px;
    background:var(--ink);
    color:#fff;
    text-align:center;
    padding:8px;
    font-size:9px;
    letter-spacing:.13em;
    text-transform:uppercase
}
.announce b
{
    color:var(--lime)
}
.header
{
    height:75px;
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(244,242,236,.96);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(10px)
}
.head
{
    height:100%;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:20px
}
.brand
{
    border:0;
    background:none;
    display:inline-flex;
    align-items:center;
    gap:9px;
    font:700 22px var(--display);
    letter-spacing:.05em;
    white-space:nowrap
}
.mark
{
    width:23px;
    height:23px;
    background:var(--lime);
    display:grid;
    place-items:center;
    transform:rotate(45deg);
    font:700 13px var(--display)
}
.mark span
{
    transform:rotate(-45deg)
}
.nav
{
    display:flex;
    gap:25px
}
.nav button,.nav a
{
    border:0;
    background:none;
    padding:10px 0;
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    position:relative
}
.nav button:after,.nav a:after
{
    content:"";
    height:1px;
    position:absolute;
    bottom:4px;
    left:0;
    right:100%;
    background:var(--ink);
    transition:.2s
}
.nav button:hover:after,.nav a:hover:after
{
    right:0
}
.actions
{
    display:flex;
    justify-content:flex-end;
    gap:5px
}
.icon
{
    width:39px;
    height:39px;
    border:0;
    background:transparent;
    border-radius:50%;
    position:relative;
    display:grid;
    place-items:center;
    font-size:18px;
    color:var(--ink)
}
.icon:hover
{
    background:var(--soft)
}
.count
{
    position:absolute;
    right:0;
    top:0;
    background:var(--lime);
    min-width:16px;
    height:16px;
    border-radius:50%;
    font-size:9px;
    display:grid;
    place-items:center;
    font-weight:700
}
.hamb
{
    display:none
}
.searchbar
{
    display:none;
    position:absolute;
    right:20px;
    top:65px;
    background:var(--paper);
    padding:12px;
    border:1px solid var(--line);
    box-shadow:0 15px 35px #17191418
}
.searchbar.open
{
    display:flex
}
.searchbar input
{
    border:0;
    background:transparent;
    outline:0;
    width:220px;
    padding:8px
}
.btn
{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--ink);
    border:1px solid var(--ink);
    color:#fff;
    min-height:45px;
    padding:13px 18px;
    font-size:10px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    transition:.18s
}
.btn:hover
{
    background:var(--lime);
    border-color:var(--lime);
    color:var(--ink);
    transform:translateY(-1px)
}
.btn.lime
{
    background:var(--lime);
    border-color:var(--lime);
    color:var(--ink)
}
.btn.lime:hover
{
    background:var(--ink);
    color:#fff
}
.btn.outline
{
    background:transparent;
    color:var(--ink)
}
.btn.small
{
    min-height:34px;
    padding:9px 12px;
    font-size:9px
}
.eyebrow
{
    font-size:9px;
    letter-spacing:.17em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--muted)
}
.display
{
    font-family:var(--display);
    text-transform:uppercase;
    font-weight:500
}
.text-btn
{
    border:0;
    background:none;
    padding:0;
    text-decoration:underline;
    text-underline-offset:4px;
    font-size:11px
}
.hero
{
    display:grid;
    grid-template-columns:1fr 1fr;
    min-height:540px;
    background:#e4e3dc
}
.hero-copy
{
    padding:60px clamp(28px,7vw,90px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start
}
.hero h1
{
    font:600 clamp(66px,8vw,112px)/.84 var(--display);
    letter-spacing:-.025em;
    text-transform:uppercase;
    margin:20px 0
}
.hero h1 span
{
    color:#657746
}
.hero p
{
    max-width:350px;
    font-size:12px;
    line-height:1.8;
    color:#575a51;
    margin:0 0 24px
}
.hero-actions
{
    display:flex;
    gap:10px;
    flex-wrap:wrap
}
.hero-photo
{
    position:relative;
    min-height:540px;
    background:#999
}
.hero-photo img
{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:saturate(.78)
}
.hero-tag
{
    position:absolute;
    bottom:20px;
    left:20px;
    background:var(--lime);
    padding:12px 15px;
    font:500 14px var(--display);
    text-transform:uppercase
}
.ticker
{
    background:var(--lime);
    padding:13px;
    overflow:hidden;
    white-space:nowrap;
    font:500 15px var(--display);
    letter-spacing:.11em;
    text-transform:uppercase
}
.ticker span
{
    padding:0 22px
}
.section
{
    padding:76px 0
}
.section-head
{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:15px;
    margin-bottom:25px
}
.section-title
{
    font:500 clamp(34px,4.6vw,54px)/.95 var(--display);
    text-transform:uppercase;
    margin:8px 0 0
}
.category-grid
{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px
}
.cat-card
{
    height:330px;
    position:relative;
    overflow:hidden;
    border:0;
    background:#aaa;
    color:#fff;
    text-align:left;
    padding:0
}
.cat-card img
{
    width:100%;
    height:100%;
    object-fit:cover;
    position:absolute;
    inset:0;
    filter:brightness(.75);
    transition:.4s
}
.cat-card:hover img
{
    transform:scale(1.04)
}
.cat-card:after
{
    content:"";
    position:absolute;
    inset:38% 0 0;
    background:linear-gradient(transparent,#0009)
}
.cat-copy
{
    position:absolute;
    z-index:1;
    bottom:20px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    align-items:end
}
.cat-copy small
{
    font-size:9px;
    letter-spacing:.1em;
    text-transform:uppercase
}
.cat-copy h3
{
    font:500 35px var(--display);
    text-transform:uppercase;
    margin:5px 0 0
}
.arrow
{
    display:grid;
    place-items:center;
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--lime);
    color:var(--ink);
    font-size:18px
}
.products
{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px
}
.card
{
    min-width:0
}
.product-img
{
    aspect-ratio:3/3.7;
    background:#e4e3dc;
    position:relative;
    overflow:hidden;
    cursor:pointer
}
.product-img>img
{
    width:100%;
    height:100%;
    object-fit:cover;
    mix-blend-mode:multiply;
    transition:.4s
}
.card:hover .product-img>img
{
    transform:scale(1.04)
}
.badge
{
    position:absolute;
    top:10px;
    left:10px;
    background:var(--lime);
    padding:6px 8px;
    font-size:8px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase
}
.wish
{
    position:absolute;
    right:9px;
    top:9px;
    border:0;
    border-radius:50%;
    width:33px;
    height:33px;
    background:#f4f2ecea;
    font-size:17px
}
.wish.on
{
    color:#c44
}
.quick
{
    position:absolute;
    bottom:9px;
    left:9px;
    right:9px;
    width:calc(100% - 18px);
    transform:translateY(50px);
    transition:.2s;
    background:#f4f2ecef;
    color:var(--ink);
    border-color:transparent
}
.card:hover .quick
{
    transform:translateY(0)
}
.product-meta
{
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding-top:11px
}
.product-meta h3
{
    font-size:11px;
    margin:0 0 5px
}
.product-meta p
{
    font-size:9px;
    color:var(--muted);
    margin:0
}
.price
{
    font-size:11px;
    font-weight:700;
    white-space:nowrap
}
.compare
{
    font-size:9px;
    color:#999;
    text-decoration:line-through;
    margin-left:4px
}
.story
{
    display:grid;
    grid-template-columns:1fr 1fr;
    background:#1c2018;
    color:#f8f7f1
}
.story img
{
    width:100%;
    height:100%;
    min-height:400px;
    object-fit:cover;
    filter:brightness(.72)
}
.story-copy
{
    padding:55px clamp(25px,7vw,90px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start
}
.story-copy .eyebrow
{
    color:var(--lime)
}
.story-copy h2
{
    font:500 clamp(42px,5vw,65px)/.94 var(--display);
    text-transform:uppercase;
    margin:15px 0
}
.story-copy p
{
    font-size:11px;
    line-height:1.8;
    color:#c4c5bb;
    max-width:390px;
    margin:0 0 22px
}
.newsletter
{
    background:var(--lime);
    padding:42px 0
}
.newsletter-inner
{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:25px
}
.newsletter h2
{
    font:500 31px/.95 var(--display);
    text-transform:uppercase;
    margin:0
}
.newsletter p
{
    font-size:10px
}
.newsletter form
{
    display:flex;
    width:min(420px,100%);
    border-bottom:1px solid var(--ink)
}
.newsletter input
{
    background:transparent;
    border:0;
    outline:0;
    padding:12px 0;
    min-width:0;
    flex:1
}
.newsletter button
{
    background:transparent;
    border:0;
    font-size:9px;
    font-weight:700;
    text-transform:uppercase
}
.footer
{
    background:#191b16;
    color:#f2f1ec;
    padding:45px 0 20px
}
.footer-grid
{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:25px;
    padding-bottom:34px
}
.footer p
{
    color:#b8b9af;
    line-height:1.8;
    font-size:10px;
    max-width:260px
}
.footer h4
{
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.13em
}
.footer-links
{
    display:grid;
    gap:9px;
    color:#b8b9af;
    font-size:10px
}
.footer button
{
    border:0;
    background:none;
    color:inherit;
    text-align:left;
    padding:0;
    font-size:10px
}
.foot-bottom
{
    border-top:1px solid #383a34;
    padding-top:14px;
    display:flex;
    justify-content:space-between;
    color:#a7a89e;
    font-size:8px
}
.banner
{
    padding:45px 0 34px;
    border-bottom:1px solid var(--line)
}
.crumb
{
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--muted);
    margin-bottom:14px
}
.banner h1
{
    font:500 clamp(46px,7vw,80px)/.9 var(--display);
    text-transform:uppercase;
    margin:0
}
.banner p
{
    max-width:510px;
    color:var(--muted);
    font-size:11px;
    line-height:1.7
}
.catalog
{
    padding:25px 0 70px
}
.filters
{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px
}
.filter-row
{
    display:flex;
    gap:8px;
    flex-wrap:wrap
}
.filters select,.filters input
{
    padding:9px;
    border:1px solid var(--line);
    background:transparent;
    font-size:10px;
    color:var(--ink);
    outline:0
}
.result
{
    font-size:9px;
    color:var(--muted);
    white-space:nowrap
}
.product-page
{
    padding:30px 0 70px
}
.detail
{
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:clamp(25px,7vw,85px);
    align-items:start
}
.detail-img
{
    aspect-ratio:4/4.6;
    background:#e5e4dc
}
.detail-img img
{
    width:100%;
    height:100%;
    object-fit:cover;
    mix-blend-mode:multiply
}
.detail-info
{
    position:sticky;
    top:105px
}
.detail-info h1
{
    font:500 clamp(40px,5vw,60px)/.95 var(--display);
    text-transform:uppercase;
    margin:9px 0
}
.detail-info>.price
{
    font-size:17px
}
.detail-info>p
{
    font-size:11px;
    line-height:1.8;
    color:var(--muted)
}
.stock
{
    font-size:10px;
    color:#496944;
    margin:16px 0
}
.label
{
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.1em;
    font-weight:700;
    margin:20px 0 9px
}
.sizes
{
    display:flex;
    gap:7px
}
.size
{
    width:42px;
    height:39px;
    background:transparent;
    border:1px solid var(--line);
    font-size:10px
}
.size.sel,.size:hover
{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff
}
.buy
{
    display:flex;
    gap:9px;
    margin-top:24px
}
.buy .btn
{
    flex:1
}
.qty
{
    display:flex;
    border:1px solid var(--line);
    align-items:center
}
.qty button
{
    border:0;
    background:transparent;
    width:31px;
    height:42px
}
.qty span
{
    font-size:10px
}
.shipping
{
    border-top:1px solid var(--line);
    margin-top:22px;
    padding-top:15px;
    font-size:10px;
    line-height:1.8;
    color:var(--muted)
}
.cart-layout,.checkout-layout
{
    display:grid;
    grid-template-columns:1fr 340px;
    gap:40px;
    align-items:start
}
.cart-line
{
    display:grid;
    grid-template-columns:85px 1fr auto;
    gap:13px;
    padding:15px 0;
    border-bottom:1px solid var(--line);
    align-items:center
}
.cart-line img
{
    width:85px;
    height:100px;
    object-fit:cover;
    background:#e5e4dd;
    mix-blend-mode:multiply
}
.cart-line h3
{
    font-size:11px;
    margin:0 0 5px
}
.cart-line p
{
    font-size:9px;
    color:var(--muted);
    margin:0 0 9px
}
.cart-line .qty button
{
    height:29px
}
.summary
{
    background:#e9e8e1;
    padding:22px;
    position:sticky;
    top:105px
}
.summary h2
{
    font:500 23px var(--display);
    text-transform:uppercase;
    margin:0 0 15px
}
.summary-row
{
    display:flex;
    justify-content:space-between;
    margin:11px 0;
    font-size:10px
}
.summary-row.total
{
    border-top:1px solid #cecec6;
    padding-top:14px;
    font-size:13px;
    font-weight:700
}
.promo
{
    display:flex;
    margin:16px 0
}
.promo input
{
    flex:1;
    min-width:0;
    padding:9px;
    border:1px solid #d2d2ca;
    background:transparent;
    font-size:10px
}
.promo button
{
    background:var(--ink);
    color:#fff;
    border:1px solid var(--ink);
    font-size:9px;
    text-transform:uppercase;
    padding:0 10px
}
.summary>.btn
{
    width:100%;
    margin-top:8px
}
.summary small
{
    display:block;
    font-size:9px;
    color:var(--muted);
    line-height:1.6;
    margin-top:13px
}
.page
{
    padding:38px 0 70px
}
.page-title
{
    font:500 clamp(38px,5vw,55px)/.95 var(--display);
    text-transform:uppercase;
    margin:5px 0 25px
}
.empty
{
    text-align:center;
    padding:70px 15px;
    color:var(--muted)
}
.empty h2
{
    font:500 34px var(--display);
    text-transform:uppercase;
    color:var(--ink);
    margin:0 0 10px
}
.empty p
{
    font-size:11px;
    max-width:360px;
    margin:0 auto 20px;
    line-height:1.7
}
.field
{
    display:grid;
    gap:6px;
    margin:12px 0
}
.field label
{
    font-size:9px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em
}
.field input,.field select,.field textarea
{
    width:100%;
    padding:11px;
    border:1px solid var(--line);
    background:#fff8;
    font-size:11px;
    outline:none
}
.field input:focus,.field select:focus,.field textarea:focus
{
    border-color:var(--ink)
}
.form-grid
{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 12px
}
.full
{
    grid-column:1/-1
}
.checkout-form h2
{
    font:500 22px var(--display);
    text-transform:uppercase;
    margin:22px 0 10px
}
.choice
{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border:1px solid var(--line);
    font-size:10px
}
.note
{
    background:#e9e8e1;
    padding:11px;
    font-size:9px;
    line-height:1.6;
    color:var(--muted)
}
.account-card
{
    background:white;
    border:1px solid var(--line);
    padding:25px;
    max-width:650px;
    margin:auto
}
.auth
{
    max-width:390px;
    margin:auto
}
.auth h2
{
    font:500 29px var(--display);
    text-transform:uppercase;
    margin:0
}
.auth p
{
    font-size:10px;
    color:var(--muted);
    line-height:1.6
}
.auth .btn
{
    width:100%;
    margin-top:8px
}
.switch
{
    text-align:center;
    font-size:10px
}
.switch button
{
    border:0;
    background:none;
    text-decoration:underline;
    font-weight:700
}
.tabs
{
    display:flex;
    gap:16px;
    border-bottom:1px solid var(--line);
    margin:15px 0
}
.tabs button
{
    padding:10px 0;
    background:none;
    border:0;
    font-size:9px;
    text-transform:uppercase;
    color:var(--muted)
}
.tabs button.active
{
    color:var(--ink);
    border-bottom:2px solid
}
.order-card
{
    border:1px solid var(--line);
    padding:13px;
    margin:9px 0;
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-size:10px
}
.pill
{
    background:#e6eed8;
    color:#47613b;
    border-radius:20px;
    padding:5px 8px;
    font-size:8px;
    text-transform:uppercase
}
.admin-login
{
    min-height:100vh;
    display:grid;
    place-items:center;
    background:#e9e8e1
}

function add(id){var p=find(id);if(!p||!p.stock){toast('This piece is out of stock');return}var size=s.size||p.sizes[0],c=cart.find(function(x){return x.id===id&&x.size===size});if(c)c.qty=Math.min(c.qty+s.qty,p.stock);else cart.push({id:id,size:size,qty:Math.min(s.qty,p.stock)});save();toast('Added to your bag');render()}
function hashpass(x){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(x)).then(function(b){return Array.from(new Uint8Array(b)).map(function(q){return q.toString(16).padStart(2,'0')}).join('')})}
function place(form){var d=new FormData(form),keys=['email','first','last','phone','address','city','state','pin'];for(var i=0;i<keys.length;i++)if(!String(d.get(keys[i])||'').trim()){toast('Please complete each required field');return}var t=totals(),items=cartRows().map(function(x){return{id:x.p.id,name:x.p.name,size:x.c.size,qty:x.c.qty,price:x.p.price}}),o={id:'UW-'+String(Date.now()).slice(-6),name:d.get('first')+' '+d.get('last'),email:d.get('email'),phone:d.get('phone'),address:d.get('address')+', '+d.get('city')+', '+d.get('state')+' '+d.get('pin'),items:items,total:t.total,status:'Processing',date:new Date().toISOString()};orders.push(o);customers.push({name:o.name,email:o.email,created:o.date});items.forEach(function(x){var p=find(x.id);if(p)p.stock=Math.max(0,p.stock-x.qty)});cart=[];save();go('thanks')}
app.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;if(a==='go'){go(b.dataset.p);return}if(a==='cat'){s.cat=b.dataset.c;s.page='category';s.query='';s.filterSize='';s.sort='featured';s.menu=false;location.hash='category';render();window.scrollTo(0,0);return}if(a==='menu'){s.menu=!s.menu;render();return}if(a==='search'){s.searchOpen=!s.searchOpen;render();var x=app.querySelector('.searchbar input');if(x)x.focus();return}if(a==='product'){s.product=b.dataset.id;s.size='';s.qty=1;go('product');return}if(a==='wish'){e.preventDefault();e.stopPropagation();var ix=wish.indexOf(b.dataset.id);if(ix>=0)wish.splice(ix,1);else wish.push(b.dataset.id);save();render();toast(ix>=0?'Removed from saved pieces':'Saved for later');return}if(a==='size'){s.size=b.dataset.size;render();return}if(a==='qty'){s.qty=Math.max(1,s.qty+Number(b.dataset.d));render();return}if(a==='add'){add(b.dataset.id);return}if(a==='cartqty'){var c=cart.find(function(x){return x.id===b.dataset.id});if(c){c.qty+=Number(b.dataset.d);if(c.qty<=0)cart=cart.filter(function(x){return x!==c});else{var p=find(c.id);if(p)c.qty=Math.min(c.qty,p.stock)}save();render()}return}if(a==='remove'){cart=cart.filter(function(x){return x.id!==b.dataset.id});save();render();return}if(a==='clear'){s.query='';s.filterSize='';s.sort='featured';render();return}if(a==='auth'){s.auth=s.auth==='login'?'signup':'login';render();return}if(a==='logout'){user=null;localStorage.removeItem('uw_customer');render();toast('Signed out');return}if(a==='accounttab'){s.account=b.dataset.tab;render();return}if(a==='admin-link'){go('admin-login');return}if(a==='section'){s.section=b.dataset.s;s.editing=null;render();return}if(a==='adminlogout'){isAdmin=false;sessionStorage.removeItem('uw_admin');go('admin-login');return}if(a==='newproduct'){s.editing={};render();return}if(a==='editproduct'){s.editing=Object.assign({},find(b.dataset.id));render();return}if(a==='cancel-edit'){s.editing=null;render();return}if(a==='deleteproduct'){if(confirm('Delete this product from the demo catalog?')){products=products.filter(function(p){return p.id!==b.dataset.id});save();render()}return}if(a==='newdiscount'){s.editing={discount:true};render();var section=app.querySelector('.admin-main');if(section)section.innerHTML=head('New promo code','Create a code customers can apply at checkout.')+'<form class="admin-form" data-f="discount"><div class="form-grid"><div class="field"><label>Promo code</label><input name="code" required></div><div class="field"><label>Type</label><select name="type"><option value="percent">Percentage</option><option value="fixed">Fixed amount</option></select></div><div class="field"><label>Value</label><input name="value" type="number" min="1" required></div></div><button class="btn lime">Create code</button></form>';return}if(a==='togglecode'){discounts[Number(b.dataset.i)].active=!discounts[Number(b.dataset.i)].active;save();render();return}if(a==='deletecode'){discounts.splice(Number(b.dataset.i),1);save();render();return}if(a==='size-guide'){toast('Relaxed fit: choose your usual size.');return}});
app.addEventListener('change',function(e){var t=e.target;if(t.matches('[data-filter]')){if(t.dataset.filter==='size')s.filterSize=t.value;else s.sort=t.value;render()}if(t.matches('[data-status]')){var o=orders.find(function(x){return x.id===t.dataset.status});if(o){o.status=t.value;save();toast('Order status updated')}}});
app.addEventListener('input',function(e){var t=e.target;if(t.matches('[data-filter="query"]')){s.query=t.value;var pos=t.selectionStart;render();var n=app.querySelector('[data-filter="query"]');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
app.addEventListener('submit',function(e){var f=e.target;if(!f.matches('form[data-f]'))return;e.preventDefault();var type=f.dataset.f,d=new FormData(f);if(type==='search'){s.query=String(d.get('q')||'');s.cat='Shop all';go('category');return}if(type==='newsletter'){toast('Thanks for joining the list (demo)');f.reset();return}if(type==='promo'){var code=String(d.get('code')||'').trim().toUpperCase();if(discounts.some(function(x){return x.active&&x.code===code})){s.promo=code;s.promoError='';toast('Promo code applied')}else{s.promo='';s.promoError='That code is not active. Check and try again.'}render();return}if(type==='checkout'){place(f);return}if(type==='adminlogin'){var m=f.querySelector('.msg');if(d.get('username')===ADMIN_USER&&d.get('password')===ADMIN_PASS){isAdmin=true;sessionStorage.setItem('uw_admin','true');s.section='Overview';go('admin')}else m.innerHTML='<div class="error">Those details did not match. Try the demo credentials shown below.</div>';return}if(type==='login'||type==='signup'){var email=String(d.get('email')).trim().toLowerCase(),pass=String(d.get('password')),m=f.querySelector('.msg');hashpass(pass).then(function(h){if(type==='signup'){if(customers.some(function(c){return c.email===email})){m.innerHTML='<div class="error">An account already uses that email.</div>';return}var c={name:String(d.get('name')).trim(),email:email,hash:h,created:new Date().toISOString()};customers.push(c);user={name:c.name,email:c.email};localStorage.setItem('uw_customer',JSON.stringify(user));save();render()}else{var c=customers.find(function(x){return x.email===email&&x.hash===h});if(!c){m.innerHTML='<div class="error">We could not find an account with those details.</div>';return}user={name:c.name,email:c.email};localStorage.setItem('uw_customer',JSON.stringify(user));render()}});return}if(type==='saveproduct'){var id=d.get('id')||'item-'+Date.now(),old=find(id),p={id:id,name:d.get('name'),cat:d.get('cat'),price:Number(d.get('price')),compare:Number(d.get('compare'))||0,color:d.get('color')||'Everyday',sizes:String(d.get('sizes')||'S,M,L,XL').split(',').map(function(x){return x.trim()}).filter(Boolean),stock:Number(d.get('stock')),badge:d.get('badge')||'',image:d.get('image'),desc:d.get('desc')||'',featured:old?old.featured:0};if(old)products=products.map(function(x){return x.id===id?p:x});else products.push(p);save();s.editing=null;render();toast('Product saved');return}if(type==='settings'){settings={threshold:Number(d.get('threshold')),delivery:Number(d.get('delivery')),returns:d.get('returns')};save();render();toast('Settings saved');return}if(type==='discount'){var code=String(d.get('code')).trim().toUpperCase();if(discounts.some(function(x){return x.code===code})){toast('That code already exists');return}discounts.push({code:code,type:d.get('type'),value:Number(d.get('value')),active:true});save();s.editing=null;render();toast('Promo code created')}});
window.addEventListener('hashchange',function(){var p=route();if(p!==s.page){s.page=p;render()}});
render();
